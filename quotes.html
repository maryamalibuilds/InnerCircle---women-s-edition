<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnerCircle | Quotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="quotes">
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">IC</div>
      <div>
        <h1>InnerCircle</h1>
        <p>Private wellness space for women</p>
      </div>
    </div>

    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="journal.html">Journal</a>
      <a href="mood.html">Mood</a>
      <a href="goals.html">Goals</a>
      <a href="quotes.html" class="active">Quotes</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="single-panel">
      <article class="panel">
        <div class="section-head">
          <div>
            <h2>Motivational & Happiness Quotes</h2>
            <p class="subtext">Save the words you want to come back to.</p>
          </div>
          <button id="newQuoteBtn" class="btn btn-secondary">Refresh Quote</button>
        </div>

        <div id="featuredQuote" class="quote-box"></div>
      </article>

      <article class="panel">
        <h3>Add Your Own Quote</h3>
        <div class="input-row block-mobile">
          <input id="customQuoteInput" type="text" placeholder="Write your own quote" />
          <button id="saveQuoteBtn" class="btn btn-primary">Save</button>
        </div>
      </article>

      <article class="panel">
        <h3>Saved Quotes</h3>
        <div id="quoteList" class="stack-list"></div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>InnerCircle • Quotes</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
